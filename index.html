      naturaleza: srcs.real && srcs.sim ? "mixta" : srcs.real ? "real" : "simulacro", estado: "Abierto", clasificacion: "Análisis de propagación (experimental)", nivel: "", comandante: "", resumen: res, inicio: asc.length ? asc[0].t : null, fin: null,
      ubicacion: [], fuente_coord: "sin-coordenadas", unidades: [], recursos: [], estructura_sci: {}, seguridad: {}, equipo: S.dev.name || "",
      bitacora: asc.map(function (e, k) { return { n: k + 1, fecha: e.t, tipo: e.cat, fuente: e.src === "real" ? "real" : "simulacro", texto: e.text, t: e.t, cat: e.cat, src: e.src, sc: e.sc || "", hash_previo: e.p || "", hash: e.h || "" }; }),
      comunicaciones: [], relevos: [], fotos: [] };
  }
  function salExport(o) {
    o = o || {}; if (!window.MerlynCerebro) return Promise.reject(new Error("No se cargó el módulo de exportación."));
    var comp = o.modo === "compartible", inc = salIncidente(), v = logVerify(S.log), aid = activeId();
    var sens = [S.dev.name, S.oper].concat((o.extra || []).map(function (s) { return String(s).trim(); })).filter(function (s) { return s && s.length >= 3; });
    var notas = ((S.ff["CUE-001"] && S.ff["CUE-001"].cal) || []).map(function (k) { return { nombre: k.id, id: k.id, md: ffCalMd(k) }; })
      .concat(((S.ff[aid] && S.ff[aid].cal) || []).map(function (k) { return { nombre: k.id, id: k.id, md: ffCalMd(k) }; }))
      .concat(((S.ffe[aid] && S.ffe[aid].cal) || []).map(function (k) { return { nombre: k.id, id: k.id, md: feCalMd(k) }; }));
    return window.MerlynCerebro.exportarIncidente(inc, { app: "piro", appVersion: "Alpha " + ALPHA, modo: comp ? "compartible" : "privado", sensibles: sens, incluirFotos: false,
      verificarCadena: function () { return !inc.bitacora.length ? "no_verificada" : v.ok ? "verificada" : "rota"; }, detalleSello: CBR_SELLO, adjuntos: [], notas: notas, ahora: o.ahora })
      .then(function (r) { r.cadena = v; r.nNotas = notas.length; return r; });
  }
  function salGuardar(r) { try { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([r.zip], { type: "application/zip" })); a.download = r.nombre; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true; } catch (e) { return false; } }
  function salCbrOpen() {
    var h = feTabs("") + AVISO_HTML + '<div class="sec"><h4>Exportar a Cerebro 🧠</h4><p class="small">Genera un paquete <b>MCX</b> (ZIP con notas Markdown y la bitácora con su sello) para la bóveda <b>MERLYN Cerebro</b> en Obsidian. Lleva las calibraciones (CAL) de la cuenca y del caso <b>' + esc(activeId()) + '</b>. Salamandra <b>no depende del Cerebro</b>: es solo un archivo, igual que en SIO y Nereida.</p>' +
      '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="sbPriv" aria-pressed="true" style="margin:0">Privado (para tu bóveda)</button><button class="btn" id="sbComp" aria-pressed="false" style="margin:0;background:#16314f">Compartible (anonimizado)</button></div>' +
      '<label>Nombres o datos a quitar en la versión compartible (separados por coma)<input id="sbExtra" placeholder="Ej.: Juan Pérez, 453 123 4567"></label>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="sbGo" style="margin:0">Generar paquete</button>' + backBtn() + '</div><div id="sbOut" class="small" style="margin-top:8px"></div></div>' +
      '<p class="small">Antes de compartir una bitácora con cualquier persona o IA, usa la versión <b>compartible</b> y revísala: la anonimización automática puede no detectar todo.</p>';
    openDlg("PIRO 3D Salamandra · Exportar a Cerebro", h, function () {
      feTabsBind(); $("cpBk").onclick = inicioOpen; var modo = "privado";
      var setM = function (m) { modo = m; $("sbPriv").setAttribute("aria-pressed", m === "privado"); $("sbComp").setAttribute("aria-pressed", m === "compartible"); $("sbPriv").style.background = m === "privado" ? "" : "#16314f"; $("sbComp").style.background = m === "compartible" ? "" : "#16314f"; };
      $("sbPriv").onclick = function () { setM("privado"); }; $("sbComp").onclick = function () { setM("compartible"); };
      $("sbGo").onclick = function () {
        $("sbOut").textContent = "Generando…";
        salExport({ modo: modo, extra: $("sbExtra").value.split(",") }).then(function (r) {
          SAL.last = r; addLog("Operación", "🧠 Paquete para Cerebro generado (" + modo + "): " + r.nombre, "sim"); saveNow();
          $("sbOut").innerHTML = '<p>Paquete <b>' + esc(r.nombre) + '</b> · ' + r.nNotas + ' calibración(es) · sellos de la bitácora: <b>' + (r.cadena.ok ? "verificada" : "ROTA") + '</b>' + (modo === "compartible" ? ' · versión <b>anonimizada</b>: revísala antes de compartir' : '') + '.</p><button class="btn" id="sbDl" style="margin:0">⬇ Descargar ZIP</button>';
          $("sbDl").onclick = function () { if (!salGuardar(r)) toast("Este visor no permite descargar archivos; usa la app instalada."); };
        }).catch(function (e) { $("sbOut").textContent = "No se pudo generar: " + e.message; });
      };
    });
  }

  // ----- ajustes y respaldo -----
  function ajOpen(msg) {
    var h = feTabs("") + AVISO_HTML + '<div class="sec"><h4>Este equipo</h4><label>Nombre del equipo (se quita en la versión compartible)<input id="ajNm" maxlength="40" value="' + esc(S.dev.name) + '" placeholder="Ej.: Tablet M-4"></label><button class="btn" id="ajNmOk" style="margin:6px 0 0">Guardar nombre</button></div>' +
      '<div class="sec"><h4>PIN de acceso (opcional)</h4><p class="small">' + (S.pin ? 'Este equipo <b>pide PIN</b> al entrar.' : 'Sin PIN: cualquiera que tenga el equipo puede entrar.') + ' El PIN solo evita usos casuales: los datos <b>no</b> se cifran.</p><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end"><label style="margin:0">Nuevo PIN (4 a 8 dígitos)<input id="ajPin" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label><button class="btn" id="ajPinOk" style="margin:0">Guardar PIN</button>' + (S.pin ? '<button class="btn" id="ajPinX" style="margin:0;background:#16314f">Quitar PIN</button>' : '') + '</div></div>' +
      '<div class="sec"><h4>Respaldo</h4><p class="small">Guarda todo (marcas, cálculos, calibraciones, bitácora) en un archivo JSON, o restaura uno. Al restaurar se revisa el contenido y la bitácora conserva sus sellos.</p><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn" id="ajBk" style="margin:0">⬇ Descargar respaldo</button><label class="btn" style="margin:0;display:inline-flex;align-items:center;cursor:pointer">⬆ Restaurar respaldo<input type="file" id="ajIn" accept="application/json,.json" style="display:none"></label></div></div>' +
      '<div class="sec"><h4>Borrar datos</h4><p class="small">Borra todo lo guardado en este equipo. No se puede deshacer: descarga antes un respaldo.</p><button class="btn" id="ajDel" style="margin:0;background:#5a1d1d">Borrar todo…</button><span id="ajDel2"></span></div>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' + backBtn() + '</div><p class="small" id="ajMsg">' + (msg ? esc(msg) : '') + '</p>';
    openDlg("PIRO 3D Salamandra · Ajustes y respaldo", h, function () {
      feTabsBind(); $("cpBk").onclick = inicioOpen;
      $("ajNmOk").onclick = function () { S.dev.name = $("ajNm").value.trim().slice(0, 40); saveNow(); ajOpen("Nombre guardado."); };
      $("ajPinOk").onclick = function () { var v = $("ajPin").value.trim(); if (!/^\d{4,8}$/.test(v)) return ajOpen("El PIN debe tener de 4 a 8 dígitos."); var salt = sha256(String(Date.now()) + Math.random()).slice(0, 16); S.pin = { salt: salt, h: sha256(salt + v) }; addLog("Operación", "Se activó un PIN de acceso en este equipo.", "sim"); saveNow(); ajOpen("PIN guardado. Se pedirá al entrar."); };
      if ($("ajPinX")) $("ajPinX").onclick = function () { S.pin = null; addLog("Operación", "Se quitó el PIN de acceso de este equipo.", "sim"); saveNow(); ajOpen("PIN quitado."); };
      $("ajBk").onclick = function () { try { var d = new Date(), a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "piro", version: ALPHA, fecha: d.toISOString(), datos: S }, null, 1)], { type: "application/json" })); a.download = "respaldo-salamandra-" + d.toISOString().slice(0, 16).replace(/[:T]/g, "") + ".json"; document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 1000); } catch (e) { toast("No se pudo descargar."); } };
      $("ajIn").onchange = function () { var f = $("ajIn").files[0]; if (!f) return; var rd = new FileReader(); rd.onload = function () { try { var j = JSON.parse(rd.result), o = limpiarEstado(j && j.datos ? j.datos : j); if (!o) throw new Error("x"); S = o; var v = logVerify(S.log); addLog("Operación", "Respaldo restaurado (" + f.name + "); bitácora " + (v.ok ? "íntegra" : "ALTERADA: " + v.why) + ".", "sim"); saveNow(); ajOpen("Respaldo restaurado."); } catch (e) { ajOpen("El archivo no es un respaldo válido de Salamandra."); } }; rd.readAsText(f); };
      $("ajDel").onclick = function () { $("ajDel2").innerHTML = ' <button class="btn" id="ajDelOk" style="margin:0;background:#5a1d1d">Sí, borrar todo</button>'; $("ajDelOk").onclick = function () { S = { v: 1, caso: "CAS-001", ff: {}, ffe: {}, clp: {}, log: [], dev: { name: "" }, oper: "", pin: null }; FC.sim = null; FC.hour = 0; saveNow(); ajOpen("Datos borrados."); }; };
    });
  }

  // ----- identidad: emblema, arranque y acceso -----
  var EMBLEMA_URL = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(EMBLEMA_SVG);
  function ponEmblema() { document.querySelectorAll("img[data-emblema]").forEach(function (im) { if (im.getAttribute("src") !== EMBLEMA_URL) im.src = EMBLEMA_URL; }); }
  function sesionOk() { try { return sessionStorage.getItem("piro-sesion") === "1"; } catch (e) { return !!SAL.sesion; } }
  function sesionAbre() { SAL.sesion = true; try { sessionStorage.setItem("piro-sesion", "1"); } catch (e) {} }
  function accesoOpen() {
    var a = $("acceso"); a.hidden = false; $("accNom").value = S.oper || ""; $("accPinW").hidden = !S.pin; $("accMsg").textContent = "";
    var entrar = function (nom) {
      if (S.pin) { var v = $("accPin").value.trim(); if (sha256(S.pin.salt + v) !== S.pin.h) { $("accMsg").textContent = "PIN incorrecto."; $("accPin").value = ""; return; } }
      S.oper = nom; addLog("Acceso", nom ? "Entra a la app: " + nom + "." : "Entra a la app sin nombre (simulacro).", "sim"); saveNow(); sesionAbre(); a.hidden = true; inicioOpen();
    };
    $("accOk").onclick = function () { var n = $("accNom").value.trim(); if (!n) { $("accMsg").textContent = "Escribe tu nombre o unidad, o entra como simulacro."; return; } entrar(n.slice(0, 40)); };
    $("accSim").onclick = function () { entrar(""); };
    $("accNom").onkeydown = $("accPin").onkeydown = function (e) { if (e.key === "Enter") $("accOk").click(); };
  }
  function arranque() {
    ponEmblema(); var sp = $("splash"), bar = $("splBar"), pasos = [["MOTOR 3D", function () { return !!window.THREE; }], ["RELIEVE DE LA CUENCA", function () { return !!fcLoad(); }], ["DATOS DE ESTE EQUIPO", function () { cargar(); return true; }], ["BITÁCORA SELLADA", function () { return true; }]], k = 0;
    var sig = function () {
      if (k < pasos.length) { $("splTxt").textContent = "CARGANDO " + pasos[k][0] + "…"; try { pasos[k][1](); } catch (e) {} k++; bar.style.width = Math.round(k / pasos.length * 100) + "%"; setTimeout(sig, 260); return; }
      if (!S.log.length) { addLog("Operación", APP + " Alpha " + ALPHA + " iniciada en este equipo.", "sim"); saveNow(); }
      $("splTxt").textContent = "LISTO"; sp.classList.add("out"); setTimeout(function () { sp.hidden = true; }, 480);
      if (sesionOk()) inicioOpen(); else { inicioOpen(); accesoOpen(); }
    };
    setTimeout(sig, 200);
  }
  $("dx").onclick = function () { FC.mode = null; inicioOpen(); };
  arranque();
  window.__sal = { S: function () { return S; }, logVerify: logVerify, salExport: salExport, ALPHA: ALPHA, sha256: sha256 };

})();
